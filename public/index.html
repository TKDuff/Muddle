<html>
<html>
    <head> 
        <title>Location</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css"integrity="sha256-kLaT2GOSpHechhsozzB+flnD+zUyjE2LlfWPgU04xyI=" crossorigin=""/>
        <script src="https://cdn.socket.io/4.3.2/socket.io.min.js"></script>
        <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"integrity="sha256-WBkoXOwTeyKclOHuWtc+i2uENFpDZ9YPdf5Hf+D7ewM=" crossorigin=""></script>
        <script src="client.js" type="text/javascript" defer>//defer used as html map must load before can make call to L.map in client.js</script>
        <script src="virtual-scroll.js" type="text/javascript" defer></script> 
        <script src="vote-handling.js" type="text/javascript" defer></script> 
        <script src="marker-switching.js" type="text/javascript" defer></script> 
        <script src="post-filtering.js" type="text/javascript" defer></script> 
        <script src="node_modules/jquery/dist/jquery.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/clusterize.js@0.18.0/clusterize.js"></script>  <!--Virtual scrolling in small file-->
        <link rel="stylesheet" type="text/css" href="style.css">
    </head>
    
    <body>
      <div id="pageContainer">
        
        <div>
          <svg style="height: 0; width: 0; position: absolute; visibility: hidden;">
              <defs id="global-defs">
              </defs>
          </svg>
        </div>

        <div id="MaynoothMap">
          <div id="svgErrorContainer"></div>
          <div id="splashScreen"></div>

          <div id="adminButtons">
          <div id ="timeTaken">
            <br>
            <br>
            <p id="zoomTime">Zoom Time: 0 ms</p>
            <p id="postTime">Post Time: 0 ms</p>
            </div>
          <div id="deleteButton">
            <br>
            <button id="wipe" onclick="wipeDB()">Wipe database</button>
          </div>
          <div id="fakePostBox">
            <button id="uniform" onclick="createUniformFakePost()">uniform</button> 
            <button id="random" onclick="createRandomFakePost()">random</button> 
            <textarea rows="1" cols="10" id="fakePostCommentBox"></textarea>    
          </div>
        </div>
        </div>
        
        <div id="feedContainer" class="clusterize-scroll"   style="overflow-y: auto;">
          <div class="clusterize-content"  id="clusterize-content">
          </div>
        </div>

        <div id="buttonsBackgroundBar"></div>
        <div id="buttonsContainer">

          <div id="postButton" data-circle-id="firstBackgroundCircle">
            <svg width="60" height="60" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle id="firstBackgroundCircle" cx="200" cy="200" r="200" fill="#7192AD" class="animated-lighten transition-circle"/>
                <rect x="100" y="186" width="200" height="25" rx="12.5" fill="#EEEEEE"/>
                <rect x="100" y="186" width="200" height="25" rx="12.5" stroke="#EEEEEE"/>
                <rect x="212.5" y="98.5" width="200" height="25" rx="12.5" transform="rotate(90 212.5 98.5)" fill="#EEEEEE"/>
                <rect x="212.5" y="98.5" width="200" height="25" rx="12.5" transform="rotate(90 212.5 98.5)" stroke="#EEEEEE"/>
            </svg>
          </div>
          
          <div id="toggleButton" data-circle-id="secondBackgroundCircle">
            <svg width="60" height="60" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle id="secondBackgroundCircle" cx="200" cy="200" r="200" fill="#7192AD" class="animated-lighten transition-circle"/>
                <circle cx="199" cy="175" r="50.5" stroke="#EEEEEE" stroke-width="25"/>
                <path d="M280.802 279.824C282.534 284.006 283.937 288.306 285.003 292.684C285.487 294.673 284.996 296.391 283.559 297.94C281.975 299.646 279.26 301 276 301L123 301C119.741 301 117.025 299.646 115.442 297.94C114.005 296.391 113.514 294.673 113.998 292.684C115.064 288.306 116.467 284.006 118.199 279.824C122.621 269.147 129.103 259.446 137.275 251.275C145.446 243.103 155.148 236.621 165.824 232.199C176.501 227.776 187.944 225.5 199.5 225.5C211.057 225.5 222.5 227.776 233.176 232.199C243.853 236.621 253.554 243.103 261.726 251.275C269.897 259.446 276.379 269.147 280.802 279.824Z" 
                      stroke="#EEEEEE" stroke-width="25"/>
                <circle id="notificationCircle" cx="325" cy="60" r="60" fill="lightcoral" class="notification-circle-icon"/>
            </svg>
          </div>

          <div id="feedButton" data-circle-id="thirdBackgroundCircle">
            <svg viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle id="thirdBackgroundCircle" cx="200" cy="200" r="200" fill="#7192AD" class="animated-lighten transition-circle"/>
              <rect x="100" y="186" width="200" height="25" rx="12.5" fill="#EEEEEE"/>
              <rect x="100" y="186" width="200" height="25" rx="12.5" stroke="#EEEEEE"/>
              <rect x="100" y="111" width="200" height="25" rx="12.5" fill="#EEEEEE"/>
              <rect x="100" y="111" width="200" height="25" rx="12.5" stroke="#EEEEEE"/>
              <rect x="99" y="264" width="200" height="25" rx="12.5" fill="#EEEEEE"/>
              <rect x="99" y="264" width="200" height="25" rx="12.5" stroke="#EEEEEE"/>
            </svg>
          </div>

        </div>

      </div>

          
      <div id="inputPopup" style="display: none;">
        <svg width="250" height="250" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
            <rect width="100%" height="100%" fill="var(--viewed-default)"/>
            <foreignObject id="customForeignObject" x="0" y="50" width="100%" height="100%">
              <textarea id="customInput" maxlength="250"  type="text" 
              style="
              font-size: 30px;
              display: flex; 
              justify-content: center; 
              align-items: center;
              width:100%;
              height:100%;
              text-align: center;
              "
              placeholder="Write what you want..."></textarea>
            </foreignObject>
          
            <foreignObject x="5" y="180" width="100%" height="15%">
              <div xmlns="http://www.w3.org/1999/xhtml" id="postCharCount" class="svg-text-content"
                  style="font-size: 14px; color: #555;">
                  0/250
              </div>  
          </foreignObject>
          <g transform="translate(-100, 22)">
            <rect x="270" y="150" width="30" height="30" fill="transparent" cursor="pointer" class="post"/>
            <line x1="270" y1="165" x2="282" y2="175" class="postLine post"/>
            <line x1="282" y1="175" x2="295" y2="150" class="postLine post"/>
          </g>
        </svg>
    </div>
        
        <svg>
            <defs>
              <rect id="defaultGradientRect" width="200" height="200" />
            </defs>
          </svg>

          
          <svg>
            <defs>
              <filter id="f1" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="1.5" dy="1.5" stdDeviation="2"/>
              </filter>
            
              <circle id="circle" cx="12.5" cy="12.5" r="10" fill="yellow" filter="url(#f1)" />
            </defs>
          </svg>
    </body>
</html>
